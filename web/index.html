<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pedal</title>
<style>
  :root { --bg:#111418; --panel:#1b2026; --line:#2c333c; --text:#e8ecf1; --dim:#8b96a3; --accent:#f0a030; --on:#3fb27f; --warn:#e5534b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.2 -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; overflow:hidden; user-select:none; }
  button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:0 14px; height:40px; }
  button:active { background:#2a313a; }
  button:disabled { opacity:.35; }
  #app { display:grid; grid-template-rows:52px 1fr; height:100%; }
  #bar { display:flex; align-items:center; gap:10px; padding:0 10px; border-bottom:1px solid var(--line); }
  #dot { width:12px; height:12px; border-radius:50%; background:var(--dim); flex:none; }
  #dot.connected { background:var(--on); } #dot.connecting { background:var(--accent); } #dot.error { background:var(--warn); }
  #title { font-size:20px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
  #title small { color:var(--accent); font-weight:400; font-size:14px; margin-left:8px; }
  #vol { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:13px; }
  #vol input { width:120px; }
  #save.dirty { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  #main { display:grid; grid-template-columns:190px 1fr; min-height:0; }
  #list, #knobs, #chips { scrollbar-width:none; }
  #list::-webkit-scrollbar, #knobs::-webkit-scrollbar, #chips::-webkit-scrollbar { display:none; }
  #list { overflow-y:auto; border-right:1px solid var(--line); -webkit-overflow-scrolling:touch; }
  #list div { height:44px; padding:0 10px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #20262d; white-space:nowrap; overflow:hidden; }
  #list div span { color:var(--dim); font-size:12px; width:22px; flex:none; text-align:right; }
  #list div.sel { background:#26303b; box-shadow:inset 3px 0 0 var(--accent); }
  #right { display:grid; grid-template-rows:48px 1fr; min-width:0; min-height:0; }
  #chips { display:flex; gap:6px; padding:6px 8px; overflow-x:auto; }
  .chip { flex:none; height:36px; padding:0 10px; border-radius:18px; border:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; justify-content:center; font-size:11px; color:var(--dim); line-height:1.15; }
  .chip b { font-size:13px; color:var(--text); font-weight:600; }
  .chip.off { opacity:.45; }
  .chip.sel { border-color:var(--accent); }
  #knobs { overflow-y:auto; padding:2px 12px 8px; -webkit-overflow-scrolling:touch; }
  .row { display:grid; grid-template-columns:96px 1fr 44px; align-items:center; gap:10px; height:52px; }
  .row label { color:var(--dim); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row output { text-align:right; font-variant-numeric:tabular-nums; font-size:18px; }
  .head { display:flex; align-items:center; justify-content:space-between; height:44px; color:var(--dim); font-size:14px; }
  .head b { color:var(--text); font-size:17px; }
  .head button.on { background:var(--on); border-color:var(--on); color:#08130d; font-weight:600; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; margin:0; touch-action:none; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:30px; height:30px; border-radius:50%; background:var(--accent); margin-top:-11px; border:0; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:var(--line); }
  input[type=range]::-moz-range-thumb { width:30px; height:30px; border-radius:50%; background:var(--accent); border:0; }
  #msg { grid-column:1 / -1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--dim); text-align:center; padding:20px; }
  #msg button { height:56px; padding:0 28px; font-size:18px; }
  #msg .err { color:var(--warn); max-width:560px; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div id="dot"></div>
    <div id="title">Pedal</div>
    <div id="vol">Vol <input id="volume" type="range" min="0" max="100"><output id="volout"></output></div>
    <button id="revert">Revert</button>
    <button id="save">Save</button>
    <button id="link">Connect</button>
  </div>
  <div id="main"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let S = null, selBlock = null, busy = 0, dragging = false, lastSlot = undefined;

async function api(path, body) {
  busy++;
  try {
    const r = await fetch('/api/' + path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    S = await r.json();
  } catch (e) { S = Object.assign(S || {names:[]}, {status:'error', error:'The pedal service is not answering.'}); }
  busy--;
  render();
}

// one request in flight per knob; the newest value wins
const pending = {};
function send(key, path, body) {
  const p = pending[key] || (pending[key] = {busy:false, next:null});
  if (p.busy) { p.next = [path, body]; return; }
  p.busy = true;
  fetch('/api/' + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
    .then(r => r.json()).then(s => { S = s; }).catch(() => {})
    .finally(() => { p.busy = false; if (p.next) { const n = p.next; p.next = null; send(key, n[0], n[1]); } else if (!dragging) render(); });
}

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) { if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const k of kids) e.append(k);
  return e;
}

function render() {
  if (!S || dragging) return;
  const connected = S.status === 'connected' && S.preset;
  $('dot').className = S.status;
  $('link').textContent = S.status === 'connected' ? 'Release' : S.status === 'connecting' ? 'Connecting…' : 'Connect';
  $('link').disabled = S.status === 'connecting';
  $('save').disabled = $('revert').disabled = !(connected && S.dirty && S.slot !== null);
  $('save').className = connected && S.dirty ? 'dirty' : '';
  $('vol').style.visibility = connected ? 'visible' : 'hidden';
  const title = $('title'); title.textContent = connected ? S.preset.name : 'Pedal';
  if (connected && S.dirty) title.append(el('small', {}, 'unsaved changes'));
  if (connected && S.slot === null) title.append(el('small', {}, 'not from a saved preset'));
  const main = $('main');

  if (!connected) {
    main.replaceChildren(el('div', {id:'msg'},
      S.status === 'connecting' ? 'Connecting to the pedal…' :
      'The pedal is free for the phone app. Connect to control it from here.',
      S.error ? el('div', {class:'err'}, S.error) : '',
      S.status === 'connecting' ? '' : el('button', {onclick:() => { S.status = 'connecting'; S.error = ''; render(); api('connect', {}); }}, 'Connect to pedal')));
    lastSlot = undefined;
    return;
  }

  $('volume').value = S.preset.volume; $('volout').textContent = S.preset.volume;

  // preset list (rebuilt only when it changes, so it keeps its scroll position)
  let list = $('list');
  const sig = S.names.join('|');
  if (!list || list.dataset.sig !== sig) {
    list = el('div', {id:'list'}); list.dataset.sig = sig;
    S.names.forEach((n, i) => list.append(el('div', {'data-slot':i, onclick:() => api('select', {slot:i})}, el('span', {}, String(i + 1)), n || '…')));
  }
  [...list.children].forEach(d => d.classList.toggle('sel', Number(d.dataset.slot) === S.slot));

  const blocks = S.preset.blocks;
  if (lastSlot !== S.slot || !blocks.some(b => b.block === selBlock)) selBlock = (blocks.find(b => b.on) || blocks[0]).block;
  const chips = el('div', {id:'chips'});
  blocks.forEach(b => chips.append(el('div', {class:'chip' + (b.on ? '' : ' off') + (b.block === selBlock ? ' sel' : ''), onclick:() => { selBlock = b.block; render(); }}, el('b', {}, b.block), b.model)));

  const cur = blocks.find(b => b.block === selBlock);
  const knobs = el('div', {id:'knobs'});
  knobs.append(el('div', {class:'head'}, el('span', {}, el('b', {}, cur.model), '  ' + cur.block),
    el('button', {class:cur.on ? 'on' : '', onclick:() => api('toggle', {block:cur.block, on:!cur.on})}, cur.on ? 'On' : 'Off')));
  cur.knobs.forEach((k, i) => {
    const out = el('output', {}, String(k.value));
    const inp = el('input', {type:'range', min:0, max:k.max, value:k.value});
    inp.oninput = () => { out.textContent = inp.value; send(cur.block + i, 'knob', {block:cur.block, index:i, value:Number(inp.value)}); };
    inp.onpointerdown = () => { dragging = true; };
    inp.onpointerup = inp.onpointercancel = () => { dragging = false; };
    knobs.append(el('div', {class:'row'}, el('label', {}, k.name), inp, out));
  });

  const right = el('div', {id:'right'}, chips, knobs);
  if (list.parentNode === main) main.replaceChildren(list, right); else { main.replaceChildren(list, right); if (lastSlot !== S.slot) { const s = list.querySelector('.sel'); if (s) s.scrollIntoView({block:'center'}); } }
  lastSlot = S.slot;
}

$('link').onclick = () => { if (S && S.status === 'connected') api('release', {}); else { if (S) { S.status = 'connecting'; S.error = ''; render(); } api('connect', {}); } };
$('save').onclick = () => api('save', {});
$('revert').onclick = () => api('revert', {});
$('volume').oninput = e => { $('volout').textContent = e.target.value; send('vol', 'volume', {value:Number(e.target.value)}); };
$('volume').onpointerdown = () => { dragging = true; };
$('volume').onpointerup = $('volume').onpointercancel = () => { dragging = false; };

api('state');
setInterval(() => { if (!busy && !dragging) api('state'); }, 3000);
</script>
</body>
</html>
